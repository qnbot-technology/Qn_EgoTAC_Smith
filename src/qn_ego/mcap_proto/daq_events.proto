syntax = "proto3";
package qnbot.daq.v1;
enum SessionEventType { SESSION_EVENT_UNSPECIFIED = 0; SESSION_START = 1; SESSION_END = 2; SESSION_ABORTED = 3; }
message SessionEvent { string session_id = 1; SessionEventType event_type = 2; string reason = 3; }
enum Severity { SEVERITY_UNSPECIFIED = 0; INFO = 1; WARNING = 2; ERROR = 3; }
message HealthEvent { string device_id = 1; string device_type = 2; Severity severity = 3; string code = 4; string message = 5; optional bool connected = 6; optional bool stale = 7; optional uint64 dropped_frames = 8; }
