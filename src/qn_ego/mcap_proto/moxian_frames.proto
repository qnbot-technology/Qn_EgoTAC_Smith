syntax = "proto3";
package qnbot.moxian.v1;
import "glove_pose.proto";
message FingerSample { string finger_name = 1; repeated sint32 pose_i16 = 2; bool valid = 3; qnbot.glove.v1.Pose pose = 4; }
message ImuSample { uint32 flags = 1; repeated sint32 gyro_i16 = 2; repeated sint32 accel_i16 = 3; uint32 tick_ms = 4; bool usable = 5; }
message MoxianFrame { string glove_id = 1; qnbot.glove.v1.HandSide hand_side = 2; uint32 board_sequence = 3; optional uint64 board_timestamp_ms = 4; uint32 subscription_bitmap = 5; uint32 valid_mask_raw = 6; repeated FingerSample fingertips = 7; optional bytes tactile_u8 = 8; ImuSample imu = 9; bytes raw_packet = 10; }
