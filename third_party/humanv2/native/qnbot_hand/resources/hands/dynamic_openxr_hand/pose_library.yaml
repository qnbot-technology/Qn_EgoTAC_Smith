calibration:
  profile_version: 1
  modes:
    basic:
      stages: [close, open, mcp90]
    enhanced:
      stages: [close, open, mcp90, pinch_first, pinch_middle, pinch_ring, pinch_little]
  stages:
    - id: close
      order: 1
      role: flat_reference
      gesture_kind: close
      prompt: 五指自然并拢并保持。
      prompt_en: Bring all five fingers together naturally and hold the pose.
      reference_pose: five_close
      fingers: [thumb, first, middle, ring, little]
      sample_count: 30
      weight: 3.0
    - id: open
      order: 2
      role: flat_reference
      gesture_kind: open
      prompt: 五指自然张开并保持。
      prompt_en: Spread all five fingers naturally and hold the pose.
      reference_pose: open
      fingers: [thumb, first, middle, ring, little]
      sample_count: 30
      weight: 0.5
    - id: mcp90
      order: 3
      role: bent_reference
      gesture_kind: mcp90
      prompt: 四指根关节弯曲约 90 度并保持。
      prompt_en: Bend the four non-thumb fingers about 90 degrees at the knuckles (MCP joints) and hold the pose.
      reference_pose: mcp90
      fingers: [first, middle, ring, little]
      sample_count: 30
      weight: 4.0
    - id: pinch_first
      order: 4
      role: tip_offset
      gesture_kind: pinch
      prompt: 拇指与first对指并保持。
      prompt_en: Bring the thumb and index finger together and hold the pose.
      reference_pose: null
      fingers: []
      partner_finger: first
      sample_count: 30
      weight: 0.0
    - id: pinch_middle
      order: 5
      role: tip_offset
      gesture_kind: pinch
      prompt: 拇指与middle对指并保持。
      prompt_en: Bring the thumb and middle finger together and hold the pose.
      reference_pose: null
      fingers: []
      partner_finger: middle
      sample_count: 30
      weight: 0.0
    - id: pinch_ring
      order: 6
      role: tip_offset
      gesture_kind: pinch
      prompt: 拇指与ring对指并保持。
      prompt_en: Bring the thumb and ring finger together and hold the pose.
      reference_pose: null
      fingers: []
      partner_finger: ring
      sample_count: 30
      weight: 0.0
    - id: pinch_little
      order: 7
      role: tip_offset
      gesture_kind: pinch
      prompt: 拇指与little对指并保持。
      prompt_en: Bring the thumb and little finger together and hold the pose.
      reference_pose: null
      fingers: []
      partner_finger: little
      sample_count: 30
      weight: 0.0

